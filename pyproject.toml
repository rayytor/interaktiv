[project]
name = "interaktiv"
version = "0.9.0"
description = "Rayyan Ekitap: interactive textbook reader for classroom smart boards (Pardus ETAP), GTK 4"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pymupdf>=1.24",
    "psutil>=5.9",
]

[project.urls]
Repository = "https://github.com/rayytor/interaktiv"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", "data", ".venv-vision", "tools/hotspot_extraction", "tools/content_extraction"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# The tests put the checkout on sys.path before importing from it.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"
filterwarnings = [
    "ignore::DeprecationWarning:gi.events",
    "ignore::DeprecationWarning:gi.overrides",
]
